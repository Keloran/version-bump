name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: 'Features'
    labels: [enhancement]
  - title: 'Fixes'
    labels: [bug]
  - title: 'Maintenance'
    labels: [chore, dependencies, documentation]
change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
version-resolver:
  major:
    labels: [major]
  minor:
    labels: [enhancement]
  default: patch
autolabeler:
  - label: enhancement
    title: ['/^feat/i']
  - label: bug
    title: ['/^fix/i']
  - label: chore
    title: ['/^chore/i', '/^ci/i', '/^refactor/i']
  - label: documentation
    title: ['/^docs/i']
template: |
  $CHANGES
