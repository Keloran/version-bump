name: 'Multi-Language Version Bump'
description: 'Automatically update version numbers in package.json, Cargo.toml, pyproject.toml, and build.gradle files'
author: 'keloran'

inputs:
  version:
    description: 'Version number to set (without v prefix). If not provided, will extract from git tag'
    required: false
  commit:
    description: 'Whether to commit the changes automatically'
    required: false
    default: 'false'
  commit-message:
    description: 'Custom commit message template'
    required: false
    default: 'chore: bump version to {version}'
  search-subdirectories:
    description: 'Whether to search subdirectories for version files'
    required: false
    default: 'true'

outputs:
  updated-files:
    description: 'List of files that were updated'
    value: ${{ steps.update.outputs.updated-files }}
  files-count:
    description: 'Number of files updated'
    value: ${{ steps.update.outputs.files-count }}

runs:
  using: 'composite'
  steps:
    - name: Extract version
      id: extract_version
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_CONTEXT_REF: ${{ github.ref }}
        GITHUB_CONTEXT_REF_NAME: ${{ github.ref_name }}
        GITHUB_RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: bash "${{ github.action_path }}/scripts/extract-version.sh"

    - name: Install dependencies
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y jq

    - name: Update version files
      id: update
      shell: bash
      env:
        VERSION: ${{ steps.extract_version.outputs.version }}
        SEARCH_SUBDIRS: ${{ inputs.search-subdirectories }}
      run: bash "${{ github.action_path }}/scripts/update-version-files.sh"

    - name: Commit changes
      if: inputs.commit == 'true' && steps.update.outputs.files-count > 0
      shell: bash
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add updated files
        git add ${{ steps.update.outputs.updated-files }}
        
        # Check if there are changes to commit
        if ! git diff --staged --quiet; then
          # Replace {version} placeholder in commit message
          COMMIT_MSG="${{ inputs.commit-message }}"
          COMMIT_MSG=${COMMIT_MSG//\{version\}/${{ steps.extract_version.outputs.version }}}
          
          git commit -m "$COMMIT_MSG"
          echo "✅ Changes committed with message: $COMMIT_MSG"
        else
          echo "ℹ️ No changes to commit"
        fi

    - name: Summary
      shell: bash
      run: |
        echo "## 📦 Version Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Version:** ${{ steps.extract_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Files Updated:** ${{ steps.update.outputs.files-count }}" >> $GITHUB_STEP_SUMMARY
        echo "**Updated Files:** ${{ steps.update.outputs.updated-files }}" >> $GITHUB_STEP_SUMMARY
        if [ "${{ inputs.commit }}" = "true" ]; then
          echo "**Git Status:** Changes committed" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Git Status:** Local changes only (not committed)" >> $GITHUB_STEP_SUMMARY
        fi

branding:
  icon: 'tag'
  color: 'blue'
